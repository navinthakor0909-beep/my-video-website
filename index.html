<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surf</title>
<style>
:root{--bg:#0f0f0f;--panel:#181818;--muted:#aaa;--line:#292929;--white:#fff;--red:#ff0033}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;padding-bottom:78px}
header{height:58px;position:sticky;top:0;z-index:5;background:rgba(15,15,15,.97);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #202020}
.logo{font-size:23px;font-weight:800;letter-spacing:-1px}.logo span{color:var(--red)}
.iconbtn{border:0;background:transparent;color:white;font-size:23px;padding:8px;cursor:pointer}
.searchbar{display:none;padding:10px 14px;background:var(--panel)}.searchbar.show{display:flex}.searchbar input{width:100%;background:#252525;border:1px solid #444;border-radius:22px;color:white;padding:11px 15px;font-size:15px;outline:none}
main{max-width:760px;margin:auto;padding:14px 12px}.page{display:none}.page.active{display:block}
.video-grid{display:grid;grid-template-columns:1fr;gap:20px}.video-card{min-width:0}.thumb{width:100%;aspect-ratio:16/9;background:#242424;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#777}.thumb video{width:100%;height:100%;object-fit:cover}.video-info{padding:9px 2px;display:flex;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;flex:none;font-weight:bold}.vtitle{font-weight:600;font-size:15px;line-height:1.35}.subtext{font-size:12px;color:var(--muted);margin-top:5px}
.empty{text-align:center;color:var(--muted);padding:65px 15px}.empty .big{font-size:38px;margin-bottom:12px}.action{background:var(--red);border:0;color:#fff;border-radius:22px;padding:11px 18px;font-weight:700;margin-top:12px}
nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:68px;padding-bottom:env(safe-area-inset-bottom);background:#171717;border-top:1px solid var(--line);display:flex;justify-content:space-around}
nav button{flex:1;background:none;border:0;color:#aaa;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}nav button .sym{font-size:22px;line-height:23px}nav button.active{color:white}
#authbox,#profilebox,#uploadbox,#channelEdit,#settingsBox{background:var(--panel);padding:18px;border-radius:14px;margin-top:18px}
.profile-actions{display:flex;gap:10px;justify-content:flex-end}
.profile-icon{background:#292929;border:1px solid #444;color:white;border-radius:10px;padding:10px 13px;font-size:19px}
.channel-banner{width:100%;height:110px;border-radius:12px;background:#292929;object-fit:cover;margin:8px 0}
.channel-head{display:flex;align-items:center;gap:12px}
.channel-logo{width:62px;height:62px;border-radius:50%;object-fit:cover;background:#333;border:2px solid #555}
.preview-label{font-size:12px;color:#aaa}
input,textarea{width:100%;background:#252525;border:1px solid #444;color:white;border-radius:9px;padding:12px;margin:7px 0;font-size:15px}
label{font-size:13px;color:#ccc}h2{font-size:20px;margin:8px 0 15px}.hidden{display:none!important}
.row{display:flex;gap:8px}.row button{flex:1}.secondary{background:#333;color:white;border:1px solid #555;border-radius:22px;padding:11px}
@media(min-width:650px){.video-grid{grid-template-columns:1fr 1fr;gap:24px}main{padding:20px}}
</style>
</head>
<body>
<header><div class="logo">surf<span>.</span></div><button class="iconbtn" id="searchToggle" aria-label="Search">⌕</button></header>
<div class="searchbar" id="searchbar"><input id="searchInput" placeholder="Search videos..."></div>
<main>
<section class="page active" id="homePage"><div id="homeVideos" class="video-grid"></div><div id="homeEmpty" class="empty"><div class="big">▶</div><div>Abhi koi video nahi hai</div><button class="action" onclick="loadVideos()">↻ Refresh</button></div></section>
<section class="page" id="subPage"><div class="empty"><div class="big">♡</div><div>Subscribed creators ke videos yahan dikhenge.</div><div class="subtext">Subscriptions feature ko agle setup step mein connect karenge.</div></div></section>
<section class="page" id="uploadPage"><h2>Upload video</h2><div id="uploadbox"><label>Video title</label><input id="videoTitle" placeholder="Video ka title"><label>Description</label><textarea id="videoDesc" rows="3" placeholder="Description (optional)"></textarea><label>Video file</label><input id="videoFile" type="file" accept="video/*"><button class="action" style="width:100%" onclick="uploadVideo()">＋ Upload</button><p class="subtext" id="uploadMsg"></p></div></section>
<section class="page" id="profilePage"><div id="signedOut"><div class="empty"><div class="big">●</div><div>Login karke apni profile dekho</div></div><div id="authbox"><h2>Login / Sign Up</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="row"><button class="action" onclick="signIn()">Login</button><button class="secondary" onclick="signUp()">Sign Up</button></div><p class="subtext" id="authMsg"></p></div></div><div id="signedIn" class="hidden">
<div id="profilebox">
<div class="profile-actions">
<button class="profile-icon" aria-label="Edit channel" onclick="openChannelEdit()">✎</button>
<button class="profile-icon" aria-label="Settings" onclick="openSettings()">⚙</button>
</div>
<img id="channelBanner" class="channel-banner hidden" alt="Channel banner">
<div class="channel-head"><img id="channelLogo" class="channel-logo" alt="Channel logo"><div><h2 id="channelName" style="margin:0">My Channel</h2><div id="channelUsername" class="subtext">@username</div></div></div>
<div id="userEmail" class="subtext"></div><div id="userId" style="font-size:12px;word-break:break-all;margin-top:8px"></div>
</div>
<div id="channelEdit" class="hidden">
<h2>Edit channel</h2>
<label>Logo image</label><input id="channelLogoFile" type="file" accept="image/*">
<label>Banner image</label><input id="channelBannerFile" type="file" accept="image/*">
<label>Channel name</label><input id="channelNameInput" placeholder="Channel name" maxlength="60">
<label>Username</label><input id="channelUsernameInput" placeholder="username (without @)" maxlength="30">
<div class="row"><button class="action" onclick="saveChannel()">Save</button><button class="secondary" onclick="closeChannelEdit()">Close</button></div>
<p class="subtext" id="channelMsg"></p>
</div>
<div id="settingsBox" class="hidden"><h2>Settings</h2><button class="action" onclick="signOut()">Log out</button><button class="secondary" onclick="closeSettings()" style="margin-left:8px">Close</button></div>
<h2 style="margin-top:24px">My videos</h2><div id="myVideos" class="video-grid"></div>
</div></section>
</main>
<nav>
<button class="active" data-page="homePage"><span class="sym">⌂</span>Home</button>
<button data-page="subPage"><span class="sym">▣</span>Subscribed</button>
<button data-page="uploadPage"><span class="sym">＋</span>Upload</button>
<button data-page="profilePage"><span class="sym">○</span>Profile</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// IMPORTANT: Apne purane index.html se asli Project URL aur Publishable key yahan paste karein.
const SUPABASE_URL = "https://scczyiossqleuzidplxx.supabase.co";
const SUPABASE_KEY = "sb_publishable_rvecUf_3ZkeAxnbAJ8iiiw_2mItGPT2";
const configured = !SUPABASE_URL.startsWith("PASTE_") && !SUPABASE_KEY.startsWith("PASTE_");
const supabaseClient = configured ? supabase.createClient(SUPABASE_URL,SUPABASE_KEY) : null;
const $ = id => document.getElementById(id);
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='profilePage')refreshProfile();if(id==='homePage')loadVideos();}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
$('searchToggle').onclick=()=>$('searchbar').classList.toggle('show');
$('searchInput').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#homeVideos .video-card').forEach(c=>c.style.display=c.dataset.title.includes(q)?'':'none');});
async function signUp(){if(!supabaseClient)return configMsg();const {error}=await supabaseClient.auth.signUp({email:$('email').value,password:$('password').value});$('authMsg').textContent=error?error.message:'Account bana. Email confirmation check karo.';}
async function signIn(){if(!supabaseClient)return configMsg();const {error}=await supabaseClient.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('authMsg').textContent=error?error.message:'Login successful';await refreshProfile();}
async function signOut(){if(supabaseClient)await supabaseClient.auth.signOut();refreshProfile();}
function configMsg(){$('authMsg').textContent='Pehle Supabase URL aur Publishable key set karni hai.';}
async function refreshProfile(){if(!supabaseClient)return;const {data:{user}}=await supabaseClient.auth.getUser();$('signedOut').classList.toggle('hidden',!!user);$('signedIn').classList.toggle('hidden',!user);if(user){const m=user.user_metadata||{};$('userEmail').textContent=user.email||'';$('userId').textContent='ID: '+user.id;$('channelName').textContent=m.channel_name||'My Channel';$('channelUsername').textContent=m.channel_username?'@'+m.channel_username:'@username';$('channelLogo').src=m.channel_logo_url||'';if(m.channel_banner_url){$('channelBanner').src=m.channel_banner_url;$('channelBanner').classList.remove('hidden');}else $('channelBanner').classList.add('hidden');$('channelNameInput').value=m.channel_name||'';$('channelUsernameInput').value=m.channel_username||'';loadVideos(true,user.id);}}
function openChannelEdit(){$('channelEdit').classList.remove('hidden');$('settingsBox').classList.add('hidden');}
function closeChannelEdit(){$('channelEdit').classList.add('hidden');$('channelMsg').textContent='';}
function openSettings(){$('settingsBox').classList.remove('hidden');$('channelEdit').classList.add('hidden');}
function closeSettings(){$('settingsBox').classList.add('hidden');}
async function uploadChannelImage(file,kind,userId){if(!file)return null;if(!file.type.startsWith('image/'))throw new Error('Sirf image file select karein.');const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'');const path=userId+'/channel-'+kind+'-'+Date.now()+'.'+ext;const {error}=await supabaseClient.storage.from('videos').upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;const {data}=await supabaseClient.storage.from('videos').createSignedUrl(path,60*60*24*365);return data?.signedUrl||null;}
async function saveChannel(){if(!supabaseClient)return;$('channelMsg').textContent='Saving...';const {data:{user}}=await supabaseClient.auth.getUser();if(!user){$('channelMsg').textContent='Pehle login karein.';return;}try{const logo=await uploadChannelImage($('channelLogoFile').files[0],'logo',user.id);const banner=await uploadChannelImage($('channelBannerFile').files[0],'banner',user.id);const updates={channel_name:$('channelNameInput').value.trim(),channel_username:$('channelUsernameInput').value.trim().replace(/^@/, '')};if(logo)updates.channel_logo_url=logo;if(banner)updates.channel_banner_url=banner;const {error}=await supabaseClient.auth.updateUser({data:updates});if(error)throw error;$('channelMsg').textContent='Channel saved!';$('channelLogoFile').value='';$('channelBannerFile').value='';await refreshProfile();closeChannelEdit();}catch(e){$('channelMsg').textContent=e.message||'Save nahi hua. Dobara try karein.';}}

async function videoCard(v){let url='';if(supabaseClient){const {data}=await supabaseClient.storage.from('avatars').createSignedUrl(v.file_path,3600);url=data?.signedUrl||'';}const card=document.createElement('div');card.className='video-card';card.dataset.title=(v.title||'').toLowerCase();const thumb=document.createElement('div');thumb.className='thumb';if(url){const player=document.createElement('video');player.src=url;player.controls=true;player.preload='metadata';thumb.appendChild(player);}else thumb.textContent='▶';const info=document.createElement('div');info.className='video-info';const av=document.createElement('div');av.className='avatar';av.textContent='S';const details=document.createElement('div');details.innerHTML='<div class="vtitle"></div><div class="subtext">Surf · Video</div>';details.querySelector('.vtitle').textContent=v.title||'Untitled video';info.append(av,details);card.append(thumb,info);return card;}
async function loadVideos(own=false,userId=null){if(!supabaseClient){$('homeEmpty').textContent='Supabase connection set karne ke baad videos yahan dikhenge.';return;}const target=own?$('myVideos'):$('homeVideos');target.innerHTML='';let query=supabaseClient.from('avatars').select('*').order('created_at',{ascending:false});if(own&&userId)query=query.eq('user_id',userId);const {data,error}=await query;if(error){if(!own){$('homeEmpty').textContent='Videos load nahi hue. Refresh karke dekhein.';}return;}if(!own)$('homeEmpty').classList.toggle('hidden',!!data?.length);for(const v of data||[])target.appendChild(await videoCard(v));}
async function uploadVideo(){if(!supabaseClient){$('uploadMsg').textContent='Supabase URL/key set karni hai.';return;}const {data:{user}}=await supabaseClient.auth.getUser();if(!user){$('uploadMsg').textContent='Upload se pehle Profile mein login karein.';return;}const file=$('videoFile').files[0],title=$('videoTitle').value.trim();if(!file||!title){$('uploadMsg').textContent='Title aur video file dono chahiye.';return;}const path=user.id+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');$('uploadMsg').textContent='Uploading...';const up=await supabaseClient.storage.from('videos').upload(path,file);if(up.error){$('uploadMsg').textContent=up.error.message;return;}const ins=await supabaseClient.from('videos').insert({title,description:$('videoDesc').value,file_path:path,user_id:user.id});if(ins.error){$('uploadMsg').textContent='File upload ho gayi, lekin video record save nahi hua: '+ins.error.message;return;}$('uploadMsg').textContent='Video upload ho gaya!';$('videoTitle').value='';$('videoDesc').value='';$('videoFile').value='';loadVideos();refreshProfile();}
refreshProfile();loadVideos();
</script>
</body></html>
