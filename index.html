<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyStream — Clean Video Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            ytDark: '#0f0f0f',
            ytDarkSec: '#272727',
            ytDarkHover: '#3f3f3f',
            ytRed: '#ff0000',
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(136, 136, 136, 0.35); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(136, 136, 136, 0.65); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    #top-progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: #ff0000;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.85);
      z-index: 9999;
      width: 0%;
      opacity: 0;
      pointer-events: none;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }

    .skeleton { position: relative; overflow: hidden; background-color: #e2e8f0; }
    .dark .skeleton { background-color: #272727; }
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      animation: shimmer 1.3s infinite;
    }
    .dark .skeleton::after {
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
    }
    @keyframes shimmer { 100% { transform: translateX(100%); } }

    .yt-spinner {
      width: 30px; height: 30px;
      border: 3px solid rgba(150, 150, 150, 0.25);
      border-top-color: #ff0000;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes likePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.45) rotate(-12deg); }
      70% { transform: scale(0.9) rotate(6deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .like-pop { animation: likePop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.7); }
      100% { opacity: 0; transform: translateY(-28px) scale(1.25); }
    }
    .float-particle { position: absolute; pointer-events: none; animation: floatUp 0.65s ease-out forwards; }

    @keyframes seekFlash {
      0% { opacity: 0; transform: scale(0.85); }
      30% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.05); }
    }
    .seek-feedback { animation: seekFlash 0.65s ease-out forwards; }
  </style>
</head>
<body class="bg-white dark:bg-ytDark text-gray-900 dark:text-gray-100 font-sans antialiased selection:bg-red-600 selection:text-white transition-colors duration-200 pb-16 md:pb-0">

  <!-- Top YouTube Red Loading Bar -->
  <div id="top-progress-bar"></div>

  <!-- Top Sticky Header: ONLY VISIBLE ON HOME TAB -->
  <header id="main-header" class="sticky top-0 z-40 h-14 px-3 sm:px-5 bg-white/95 dark:bg-ytDark/95 backdrop-blur-md border-b border-gray-200 dark:border-zinc-800 flex items-center justify-between gap-3">
    <div class="flex items-center shrink-0">
      <button onclick="switchTab('home', true)" class="flex items-center gap-2 group focus:outline-none rounded-xl p-1" title="Home">
        <div class="w-8 h-6 bg-ytRed rounded-lg flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
          <i class="fa-solid fa-play text-white text-xs ml-0.5"></i>
        </div>
        <span class="text-lg sm:text-xl font-bold tracking-tight">MyStream</span>
      </button>
    </div>

    <div class="flex-1 max-w-xl">
      <div class="flex w-full items-center bg-gray-100 dark:bg-[#121212] border border-gray-300 dark:border-zinc-700 focus-within:border-blue-500 dark:focus-within:border-blue-500 rounded-full overflow-hidden transition-colors">
        <input 
          id="search-input" 
          type="text" 
          placeholder="Search videos..." 
          class="w-full bg-transparent px-4 py-1.5 text-sm focus:outline-none placeholder-gray-500 dark:placeholder-gray-400"
          onkeydown="if(event.key==='Enter') handleSearch()"
          oninput="toggleClearBtn()"
        />
        <button id="clear-search-btn" onclick="clearSearch()" title="Clear" class="hidden px-2 text-gray-400 hover:text-gray-700 dark:hover:text-gray-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <button onclick="handleSearch()" title="Search" class="bg-gray-200 dark:bg-ytDarkSec hover:bg-gray-300 dark:hover:bg-ytDarkHover px-4 py-1.5 border-l border-gray-300 dark:border-zinc-700 text-gray-700 dark:text-gray-200 transition-colors">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </button>
      </div>
    </div>

    <div class="flex items-center shrink-0">
      <button onclick="openUploadModal()" title="Upload" aria-label="Upload" class="flex items-center justify-center bg-ytRed hover:bg-red-700 text-white w-9 h-9 rounded-full shadow-xs transition-all active:scale-95">
        <i class="fa-solid fa-plus text-base"></i>
      </button>
    </div>
  </header>

  <!-- Main Workspace Container -->
  <div class="flex min-h-[calc(100vh-3.5rem)]">
    
    <!-- Desktop Left Sidebar -->
    <aside class="hidden md:flex flex-col w-56 shrink-0 border-r border-gray-200 dark:border-zinc-800 p-3 gap-1 sticky top-0 h-screen">
      <button onclick="switchTab('home')" data-tab="home" class="nav-btn flex items-center gap-4 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-colors bg-gray-100 dark:bg-ytDarkSec">
        <i class="fa-solid fa-house w-5 text-center text-base"></i>
        <span>Home</span>
      </button>
      <button onclick="switchTab('subscribed')" data-tab="subscribed" class="nav-btn flex items-center gap-4 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-ytDarkSec transition-colors">
        <i class="fa-solid fa-layer-group w-5 text-center text-base"></i>
        <span>Subscribed</span>
      </button>
      <button onclick="switchTab('profile')" data-tab="profile" class="nav-btn flex items-center gap-4 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-ytDarkSec transition-colors">
        <i class="fa-solid fa-circle-user w-5 text-center text-base"></i>
        <span>Profile</span>
      </button>
    </aside>

    <!-- Main Dynamic Content Area -->
    <main class="flex-1 min-w-0 p-3 sm:p-5 lg:p-6">
      <div id="skeleton-container" class="hidden"></div>

      <div id="content-container">
        <!-- 1. HOME TAB -->
        <section id="tab-home" class="tab-section">
          <div id="search-banner" class="hidden mb-4 p-3 rounded-xl bg-gray-100 dark:bg-ytDarkSec flex items-center justify-between text-sm">
            <span>Showing results for: <strong id="search-query-label" class="text-ytRed"></strong></span>
            <button onclick="clearSearch()" class="text-xs underline text-gray-500 hover:text-gray-900 dark:hover:text-white">Reset</button>
          </div>
          <div id="home-video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-4 gap-y-6"></div>
          <div id="empty-home" class="hidden py-16 text-center text-gray-400">
            <i class="fa-solid fa-video-slash text-3xl mb-2"></i>
            <p>Abhi tak koi video upload nahi kiya gaya hai.</p>
          </div>
        </section>

        <!-- 2. SUBSCRIBED TAB -->
        <section id="tab-subscribed" class="tab-section hidden">
          <h2 class="text-base sm:text-lg font-bold mb-4">Subscribed Channels Feed</h2>
          <div id="subs-video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-4 gap-y-6"></div>
          <div id="empty-subscribed" class="hidden py-16 text-center text-gray-400">
            <i class="fa-solid fa-users-slash text-3xl mb-2"></i>
            <p>Aapne abhi tak kisi bhi channel ko subscribe nahi kiya hai.</p>
          </div>
        </section>

        <!-- 3. PROFILE / AUTH TAB -->
        <section id="tab-profile" class="tab-section hidden max-w-6xl mx-auto">
          <!-- Auth Panel (Login / Signup) -->
          <div id="auth-panel" class="max-w-md mx-auto p-6 rounded-2xl bg-gray-100 dark:bg-ytDarkSec border border-gray-200 dark:border-zinc-800 mt-10">
            <h3 class="text-lg font-bold mb-4 text-center">Login to MyChannel</h3>
            <input id="auth-email" type="email" placeholder="Email address" class="w-full px-3 py-2 mb-3 rounded-xl bg-white dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 text-sm focus:outline-none focus:border-ytRed" />
            <input id="auth-password" type="password" placeholder="Password" class="w-full px-3 py-2 mb-4 rounded-xl bg-white dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 text-sm focus:outline-none focus:border-ytRed" />
            <div class="flex gap-2">
              <button onclick="handleLogin()" class="flex-1 py-2 rounded-full bg-ytRed hover:bg-red-700 text-white text-xs font-semibold">Login</button>
              <button onclick="handleSignup()" class="flex-1 py-2 rounded-full bg-gray-200 dark:bg-zinc-700 hover:opacity-90 text-xs font-semibold">Sign Up</button>
            </div>
            <p id="auth-message" class="text-xs text-center text-red-500 mt-3"></p>
          </div>

          <!-- Logged-in Profile Panel -->
          <div id="profile-panel" hidden>
            <div id="banner-container" class="relative w-full h-28 sm:h-40 rounded-2xl bg-gradient-to-r from-red-600 via-rose-700 to-zinc-900 mb-4 flex items-end justify-between p-4 shadow-xs overflow-hidden bg-cover bg-center">
              <button onclick="openEditModal('banner')" class="w-9 h-9 rounded-full bg-black/60 hover:bg-black text-white flex items-center justify-center transition-colors shadow-md" title="Edit Banner">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
            </div>

            <div class="flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-6 p-5 rounded-2xl bg-gray-100 dark:bg-ytDarkSec/70 border border-gray-200 dark:border-zinc-800 mb-6 relative">
              <div class="relative group shrink-0">
                <div id="profile-logo-container" class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center text-white text-3xl font-bold shadow-lg overflow-hidden bg-cover bg-center">
                  <span id="profile-logo-text">A</span>
                </div>
                <button onclick="openEditModal('logo')" class="absolute inset-0 bg-black/50 rounded-full opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-sm" title="Edit Logo">
                  <i class="fa-solid fa-pen"></i>
                </button>
              </div>

              <div class="text-center sm:text-left flex-1">
                <div class="flex items-center justify-center sm:justify-between gap-2">
                  <div>
                    <h1 id="display-nickname" class="text-xl sm:text-2xl font-bold">My Channel</h1>
                    <p id="display-username" class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5">@username • 0 subscribers</p>
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="openEditModal('all')" class="w-9 h-9 rounded-full bg-gray-200 dark:bg-zinc-700 hover:opacity-90 flex items-center justify-center text-sm transition-opacity" title="Edit Profile">
                      <i class="fa-solid fa-pen"></i>
                    </button>
                    <button onclick="openSettingsModal()" class="w-9 h-9 rounded-full bg-gray-200 dark:bg-zinc-700 hover:opacity-90 flex items-center justify-center text-sm transition-opacity" title="Settings">
                      <i class="fa-solid fa-gear"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-3">
                <h2 class="text-base sm:text-lg font-bold flex items-center gap-2">
                  <i class="fa-solid fa-film text-ytRed"></i> Your Uploaded Videos
                </h2>
              </div>
              <div id="user-uploads-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Mobile Sticky Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 h-14 bg-white/95 dark:bg-ytDark/95 backdrop-blur-md border-t border-gray-200 dark:border-zinc-800 flex items-center justify-around">
    <button onclick="switchTab('home')" data-tab="home" class="nav-btn flex flex-col items-center justify-center gap-0.5 flex-1 h-full text-ytRed font-semibold">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[11px]">Home</span>
    </button>
    <button onclick="switchTab('subscribed')" data-tab="subscribed" class="nav-btn flex flex-col items-center justify-center gap-0.5 flex-1 h-full text-gray-500 dark:text-gray-400">
      <i class="fa-solid fa-layer-group text-base"></i>
      <span class="text-[11px]">Subscribed</span>
    </button>
    <button onclick="switchTab('profile')" data-tab="profile" class="nav-btn flex flex-col items-center justify-center gap-0.5 flex-1 h-full text-gray-500 dark:text-gray-400">
      <i class="fa-solid fa-circle-user text-base"></i>
      <span class="text-[11px]">Profile</span>
    </button>
  </nav>

  <!-- UPLOAD VIDEO MODAL -->
  <div id="upload-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#1f1f1f] w-full max-w-md rounded-2xl border border-gray-200 dark:border-zinc-700 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200 dark:border-zinc-800">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-video text-ytRed"></i> Upload Video
        </h3>
        <button onclick="closeUploadModal()" class="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-zinc-800 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-5 space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Video Title</label>
          <input id="upload-title" type="text" placeholder="Video title" class="w-full px-3 py-2 rounded-xl bg-gray-100 dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 text-sm focus:outline-none focus:border-ytRed" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Video File (MP4)</label>
          <input id="upload-file" type="file" accept="video/*" class="w-full text-xs text-gray-400" />
        </div>
        <div class="pt-3 flex justify-end gap-2">
          <button onclick="closeUploadModal()" class="px-4 py-2 rounded-full text-xs font-medium hover:bg-gray-100 dark:hover:bg-zinc-800">Cancel</button>
          <button onclick="uploadRealVideo()" class="px-5 py-2 rounded-full bg-ytRed hover:bg-red-700 text-white text-xs font-semibold shadow-sm">Upload</button>
        </div>
        <p id="upload-msg" class="text-xs text-center text-gray-400 mt-2"></p>
      </div>
    </div>
  </div>

  <!-- EDIT PROFILE MODAL -->
  <div id="edit-profile-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#1f1f1f] w-full max-w-md rounded-2xl border border-gray-200 dark:border-zinc-700 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200 dark:border-zinc-800">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-pen text-ytRed"></i> Edit Profile
        </h3>
        <button onclick="closeEditModal()" class="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-zinc-800 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-5 space-y-3">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Channel Name</label>
          <input id="edit-nickname" type="text" class="w-full px-3 py-2 rounded-xl bg-gray-100 dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 text-sm focus:outline-none focus:border-ytRed" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Username</label>
          <input id="edit-username" type="text" class="w-full px-3 py-2 rounded-xl bg-gray-100 dark:bg-zinc-800 border border-gray-300 dark:border-zinc-700 text-sm focus:outline-none focus:border-ytRed" />
        </div>
        <div class="pt-3 flex justify-end gap-2">
          <button onclick="closeEditModal()" class="px-4 py-2 rounded-full text-xs font-medium hover:bg-gray-100 dark:hover:bg-zinc-800">Cancel</button>
          <button onclick="saveRealProfile()" class="px-5 py-2 rounded-full bg-ytRed hover:bg-red-700 text-white text-xs font-semibold shadow-sm">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#1f1f1f] w-full max-w-md rounded-2xl border border-gray-200 dark:border-zinc-700 shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200 dark:border-zinc-800">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-gear text-ytRed"></i> Settings
        </h3>
        <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-zinc-800 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-5 space-y-4">
        <div class="p-3.5 rounded-xl bg-gray-100 dark:bg-zinc-800 flex items-center justify-between">
          <span class="text-sm font-semibold">Log out from account</span>
          <button onclick="handleLogout()" class="px-4 py-1.5 rounded-full bg-red-600 hover:bg-red-700 text-white text-xs font-semibold">Log Out</button>
        </div>
        <div class="flex justify-end">
          <button onclick="closeSettingsModal()" class="px-5 py-2 rounded-full bg-gray-200 dark:bg-zinc-800 text-xs font-semibold">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- VIDEO PLAYER MODAL -->
  <div id="player-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#181818] w-full max-w-2xl rounded-2xl overflow-hidden border border-gray-200 dark:border-zinc-800 shadow-2xl">
      <div class="relative aspect-video bg-black flex flex-col items-center justify-center text-white">
        <button onclick="closePlayerModal()" class="absolute top-3 right-3 z-20 w-9 h-9 rounded-full bg-black/60 hover:bg-black text-white flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <video id="modal-video-player" controls autoplay class="w-full h-full object-contain"></video>
      </div>
      <div class="p-4">
        <h3 id="modal-video-title" class="text-base font-bold"></h3>
        <p id="modal-video-channel" class="text-xs text-gray-400 mt-1"></p>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-16 md:bottom-6 left-1/2 -translate-x-1/2 z-50 hidden bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://scczyiossqleuzidplxx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rvecUf_3ZkeAxnbAJ8iiiw_2mItGPT2";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentTab = 'home';

    function triggerTopProgressBar(duration = 600) {
      const bar = document.getElementById('top-progress-bar');
      bar.style.transition = 'none';
      bar.style.width = '0%';
      bar.style.opacity = '1';
      void bar.offsetWidth;
      bar.style.transition = `width ${duration * 0.7}ms ease-out`;
      bar.style.width = '80%';
      setTimeout(() => { bar.style.width = '100%'; }, duration * 0.7);
      setTimeout(() => { bar.style.opacity = '0'; }, duration);
    }

    async function switchTab(tabName, resetSearch = false) {
      currentTab = tabName;
      try { sessionStorage.setItem('mystream_active_tab', tabName); } catch(e) {}

      const mainHeader = document.getElementById('main-header');
      if (mainHeader) {
        if (tabName === 'home') mainHeader.classList.remove('hidden');
        else mainHeader.classList.add('hidden');
      }

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isTarget = btn.getAttribute('data-tab') === tabName;
        if (btn.closest('aside')) {
          btn.className = isTarget
            ? 'nav-btn flex items-center gap-4 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-colors bg-gray-100 dark:bg-ytDarkSec text-gray-900 dark:text-white'
            : 'nav-btn flex items-center gap-4 px-3.5 py-2.5 rounded-xl text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-ytDarkSec transition-colors';
        } else {
          btn.className = isTarget
            ? 'nav-btn flex flex-col items-center justify-center gap-0.5 flex-1 h-full text-ytRed font-semibold'
            : 'nav-btn flex flex-col items-center justify-center gap-0.5 flex-1 h-full text-gray-500 dark:text-gray-400';
        }
      });

      triggerTopProgressBar();
      document.querySelectorAll('.tab-section').forEach(sec => sec.classList.add('hidden'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      if (tabName === 'home') await loadHomeVideos();
      else if (tabName === 'subscribed') await loadSubscribedVideos();
      else if (tabName === 'profile') checkUserSession();
    }

    async function checkUserSession() {
      const { data: { user } } = await sb.auth.getUser();
      currentUser = user;
      const authPanel = document.getElementById('auth-panel');
      const profilePanel = document.getElementById('profile-panel');

      if (!user) {
        authPanel.hidden = false;
        profilePanel.hidden = true;
      } else {
        authPanel.hidden = true;
        profilePanel.hidden = false;
        await loadUserProfileAndUploads(user);
      }
    }

    async function handleSignup() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const { error } = await sb.auth.signUp({ email, password });
      if (error) document.getElementById('auth-message').textContent = error.message;
      else { showToast('Account created! You can now log in.'); }
    }

    async function handleLogin() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) document.getElementById('auth-message').textContent = error.message;
      else { showToast('Login successful!'); checkUserSession(); }
    }

    async function handleLogout() {
      await sb.auth.signOut();
      currentUser = null;
      closeSettingsModal();
      checkUserSession();
      showToast('Logged out successfully');
    }

    async function loadUserProfileAndUploads(user) {
      let { data: profile } = await sb.from('profiles').select('*').eq('user_id', user.id).maybeSingle();
      let nickname = profile?.channel_name || user.user_metadata?.channel_name || 'My Channel';
      let username = profile?.username || user.user_metadata?.username || '@' + user.email.split('@')[0];

      document.getElementById('display-nickname').textContent = nickname;
      document.getElementById('display-username').textContent = `${username} • 0 subscribers`;

      // Load user uploaded videos from database
      const { data: videos } = await sb.from('videos').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
      const grid = document.getElementById('user-uploads-grid');
      
      if (!videos || videos.length === 0) {
        grid.innerHTML = `<p class="text-xs text-gray-400 col-span-full">Aapne abhi tak koi video upload nahi kiya hai.</p>`;
        return;
      }

      grid.innerHTML = videos.map(v => `
        <article onclick="openPlayer('${v.file_path}', '${v.title}', '${nickname}')" class="group cursor-pointer flex flex-col gap-2">
          <div class="relative w-full aspect-video rounded-xl bg-zinc-800 flex items-center justify-center overflow-hidden">
            <i class="fa-solid fa-play text-white/50 text-2xl"></i>
          </div>
          <div>
            <h4 class="text-sm font-semibold truncate">${v.title}</h4>
            <p class="text-xs text-gray-400">${new Date(v.created_at).toLocaleDateString()}</p>
          </div>
        </article>
      `).join('');
    }

    async function loadHomeVideos() {
      const grid = document.getElementById('home-video-grid');
      const emptyDiv = document.getElementById('empty-home');
      grid.innerHTML = '';

      const { data: videos, error } = await sb.from('videos').select('*').order('created_at', { ascending: false });
      if (error || !videos || videos.length === 0) {
        emptyDiv.classList.remove('hidden');
        return;
      }
      emptyDiv.classList.add('hidden');

      for (let v of videos) {
        let { data: prof } = await sb.from('profiles').select('channel_name').eq('user_id', v.user_id).maybeSingle();
        let channelName = prof?.channel_name || 'Creator';

        grid.innerHTML += `
          <article onclick="openPlayer('${v.file_path}', '${v.title}', '${channelName}')" class="group cursor-pointer flex flex-col gap-2.5">
            <div class="relative w-full aspect-video rounded-xl bg-zinc-800 flex items-center justify-center overflow-hidden shadow-xs">
              <i class="fa-solid fa-play text-white/40 text-3xl group-hover:scale-110 transition-transform"></i>
            </div>
            <div class="flex gap-3 items-start">
              <div class="w-9 h-9 rounded-full bg-red-600 text-white font-bold text-sm flex items-center justify-center shrink-0">
                ${channelName.charAt(0).toUpperCase()}
              </div>
              <div class="min-w-0 flex-1">
                <h3 class="text-sm font-semibold leading-snug line-clamp-2 group-hover:text-ytRed transition-colors">${v.title}</h3>
                <p class="text-xs text-gray-400 mt-1">${channelName}</p>
              </div>
            </div>
          </article>
        `;
      }
    }

    async function loadSubscribedVideos() {
      const grid = document.getElementById('subs-video-grid');
      const emptyDiv = document.getElementById('empty-subscribed');
      grid.innerHTML = '';

      if (!currentUser) {
        emptyDiv.classList.remove('hidden');
        emptyDiv.innerHTML = `<p class="text-sm">Subscribed videos dekhne ke liye pehle Profile mein login karein.</p>`;
        return;
      }

      const { data: subs } = await sb.from('subscriptions').select('channel_id').eq('subscriber_id', currentUser.id);
      if (!subs || subs.length === 0) {
        emptyDiv.classList.remove('hidden');
        return;
      }
      emptyDiv.classList.add('hidden');

      const channelIds = subs.map(s => s.channel_id);
      const { data: videos } = await sb.from('videos').select('*').in('user_id', channelIds).order('created_at', { ascending: false });

      if (!videos || videos.length === 0) {
        emptyDiv.classList.remove('hidden');
        return;
      }

      for (let v of videos) {
        let { data: prof } = await sb.from('profiles').select('channel_name').eq('user_id', v.user_id).maybeSingle();
        let channelName = prof?.channel_name || 'Creator';

        grid.innerHTML += `
          <article onclick="openPlayer('${v.file_path}', '${v.title}', '${channelName}')" class="group cursor-pointer flex flex-col gap-2.5">
            <div class="relative w-full aspect-video rounded-xl bg-zinc-800 flex items-center justify-center overflow-hidden shadow-xs">
              <i class="fa-solid fa-play text-white/40 text-3xl group-hover:scale-110 transition-transform"></i>
            </div>
            <div class="flex gap-3 items-start">
              <div class="w-9 h-9 rounded-full bg-red-600 text-white font-bold text-sm flex items-center justify-center shrink-0">
                ${channelName.charAt(0).toUpperCase()}
              </div>
              <div class="min-w-0 flex-1">
                <h3 class="text-sm font-semibold leading-snug line-clamp-2 group-hover:text-ytRed transition-colors">${v.title}</h3>
                <p class="text-xs text-gray-400 mt-1">${channelName}</p>
              </div>
            </div>
          </article>
        `;
      }
    }

    async function uploadRealVideo() {
      if (!currentUser) { alert('Pehle Profile mein login karein!'); return; }
      const title = document.getElementById('upload-title').value.trim();
      const fileInput = document.getElementById('upload-file').files[0];
      const msg = document.getElementById('upload-msg');

      if (!title || !fileInput) { msg.textContent = 'Title aur video file select karein.'; return; }
      msg.textContent = 'Uploading...';

      const filePath = `${currentUser.id}/${Date.now()}_${fileInput.name}`;
      const { error: uploadErr } = await sb.storage.from('Videos').upload(filePath, fileInput);
      
      if (uploadErr) { msg.textContent = uploadErr.message; return; }

      const { error: dbErr } = await sb.from('videos').insert({ title, file_path: filePath, user_id: currentUser.id });
      if (dbErr) { msg.textContent = dbErr.message; return; }

      msg.textContent = 'Upload complete!';
      setTimeout(() => { closeUploadModal(); switchTab('home'); }, 1000);
    }

    async function openPlayer(path, title, channel) {
      const { data } = await sb.storage.from('Videos').createSignedUrl(path, 3600);
      if (!data) { alert('Video link nahi mila'); return; }
      
      document.getElementById('modal-video-player').src = data.signedUrl;
      document.getElementById('modal-video-title').textContent = title;
      document.getElementById('modal-video-channel').textContent = channel;
      document.getElementById('player-modal').classList.remove('hidden');
    }

    function closePlayerModal() {
      const player = document.getElementById('modal-video-player');
      player.pause();
      player.src = '';
      document.getElementById('player-modal').classList.add('hidden');
    }

    function openUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
    function closeUploadModal() { document.getElementById('upload-modal').classList.add('hidden'); }
    function openSettingsModal() { document.getElementById('settings-modal').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }
    
    function openEditModal() {
      document.getElementById('edit-nickname').value = document.getElementById('display-nickname').textContent;
      document.getElementById('edit-profile-modal').classList.remove('hidden');
    }
    function closeEditModal() { document.getElementById('edit-profile-modal').classList.add('hidden'); }

    async function saveRealProfile() {
      const nick = document.getElementById('edit-nickname').value.trim();
      if (!currentUser || !nick) return;
      await sb.from('profiles').upsert({ user_id: currentUser.id, channel_name: nick }, { onConflict: 'user_id' });
      closeEditModal();
      checkUserSession();
      showToast('Profile updated!');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2500);
    }

    window.addEventListener('DOMContentLoaded', () => {
      let savedTab = 'home';
      try {
        const stored = sessionStorage.getItem('mystream_active_tab');
        if (stored) savedTab = stored;
      } catch(e) {}
      switchTab(savedTab);
    });
  </script>
</body>
</html>
