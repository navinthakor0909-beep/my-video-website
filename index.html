function timeAgo(value){if(!value)return 'just now';let sec=Math.max(0,Math.floor((Date.now()-new Date(value).getTime())/1000));if(sec<60)return sec+' sec ago';if(sec<3600)return Math.floor(sec/60)+' min ago';if(sec<86400)return Math.floor(sec/3600)+' hr ago';if(sec<2592000)return Math.floor(sec/86400)+' days ago';if(sec<31536000)return Math.floor(sec/2592000)+' months ago';return Math.floor(sec/31536000)+' years ago'}
function setPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));$('searchWrap').classList.remove('show');try{sessionStorage.setItem('surf_last_page',id);if(id==='watch'&&currentVideo?.id)sessionStorage.setItem('surf_last_video',currentVideo.id)}catch(e){}if(id==='profile')refreshProfile();if(id==='home')loadVideos();if(id==='subscribed')loadSubscribedVideos();
                     if(id==='admin')loadAdminReports();if(id==='watch')$('watchPlayer').pause()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('searchBtn').onclick=()=>$('searchWrap').classList.toggle('show');$('searchInput').oninput=e=>document.querySelectorAll('#videos .video-card').forEach(c=>c.hidden=!c.dataset.title.includes(e.target.value.toLowerCase()));
async function signup(){let {error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});$('authMessage').textContent=error?error.message:'Account bana. Email check karein.'}
async function login(){let {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('authMessage').textContent=error?error.message:'Login successful';if(!error)await refreshProfile()}
async function logout(){await sb.auth.signOut();await refreshProfile();setPage('home')}
async function getImage(path){if(!path)return fallbackAvatar;let {data,error}=await sb.storage.from(AVATAR_BUCKET).createSignedUrl(path,3600);return error?fallbackAvatar:data.signedUrl}
async function getProfile(uid){if(!uid)return {channel_name:'Surf Channel'};let {data}=await sb.from('profiles').select('*').eq('user_id',uid).maybeSingle();if(data)return data;if(currentUser?.id===uid){let m=currentUser.user_metadata||{};return {channel_name:m.channel_name||'My Channel',username:m.username||'',logo_path:m.logo_path||null}}return {channel_name:'Surf Channel'}}
async function refreshProfile(){let {data}=await sb.auth.getUser();currentUser=data.user;$('authPanel').hidden=!!currentUser;$('profilePanel').hidden=!currentUser;if(!currentUser)return;let p=await getProfile(currentUser.id),m=currentUser.user_metadata||{};$('channelName').textContent=p.channel_name||m.channel_name||'My Channel';$('channelUsername').textContent='@'+(p.username||m.username||'username');$('accountEmail').textContent=currentUser.email||'';let {count:subsCount}=await sb.from('subscriptions').select('*',{count:'exact',head:true}).eq('channel_id',currentUser.id);$('subscriberCount').textContent=(subsCount||0).toLocaleString()+' subscribers';$('editName').value=p.channel_name||m.channel_name||'';$('editUsername').value=p.username||m.username||'';$('avatarPreview').src=await getImage(p.logo_path||m.logo_path);$('bannerPreview').hidden=!m.banner_path;if(m.banner_path)$('bannerPreview').src=await getImage(m.banner_path);await loadVideos(true)}
function openEdit(){$('settingsPanel').hidden=true;$('editPanel').hidden=false}function closeEdit(){$('editPanel').hidden=true}function openSettings(){$('editPanel').hidden=true;$('settingsPanel').hidden=false}
async function uploadImage(file,kind){if(!file)return null;let ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');let path=currentUser.id+'/'+kind+'_'+Date.now()+'.'+ext;let {error}=await sb.storage.from(AVATAR_BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return path}
async function saveProfile(){try{$('editMessage').textContent='Saving...';let meta={...(currentUser.user_metadata||{}),channel_name:$('editName').value.trim(),username:$('editUsername').value.trim().replace(/^@/,'')};let logo=await uploadImage($('logoFile').files[0],'logo'),banner=await uploadImage($('bannerFile').files[0],'banner');if(logo)meta.logo_path=logo;if(banner)meta.banner_path=banner;let {error}=await sb.auth.updateUser({data:meta});if(error)throw error;let {error:pe}=await sb.from('profiles').upsert({user_id:currentUser.id,channel_name:meta.channel_name,username:meta.username,logo_path:meta.logo_path||null},{onConflict:'user_id'});if(pe)throw pe;$('editMessage').textContent='Saved!';await refreshProfile();$('editPanel').hidden=true}catch(e){$('editMessage').textContent=e.message||'Save nahi hua'}}
async function makeCard(v,target){let c=document.createElement('div');c.className='video-card';c.dataset.title=(v.title||'').toLowerCase();let thumb=document.createElement('div');thumb.className='video-thumb';let ti=document.createElement('img');ti.alt='Video thumbnail';if(v.thumbnail_path){try{ti.src=await signedUrl(v.thumbnail_path)}catch(e){ti.src=await generateVideoThumbnail(v)}}else{ti.src=await generateVideoThumbnail(v)}if(ti.src)thumb.append(ti);else thumb.textContent='▶';let title=document.createElement('div');title.className='vtitle';title.textContent=v.title||'Untitled';let line=document.createElement('div');line.className='channel-line';let p=await getProfile(v.user_id),img=document.createElement('img');img.className='mini-avatar';img.src=await getImage(p.logo_path);let details=document.createElement('div');details.style.display='flex';details.style.flexDirection='column';details.style.gap='3px';let nm=document.createElement('span');nm.textContent=p.channel_name||'Surf Channel';let meta=document.createElement('span');meta.textContent=Number(v.views||0).toLocaleString()+' views · '+timeAgo(v.created_at);details.append(nm,meta);line.append(img,details);c.append(thumb,title,line);c.onclick=()=>openWatch(v);target.append(c)}
async function generateVideoThumbnail(v){try{let url=await signedUrl(v.file_path);return await new Promise(resolve=>{let video=document.createElement('video');video.crossOrigin='anonymous';video.muted=true;video.preload='auto';video.onloadeddata=()=>{try{video.currentTime=Math.min(1,Math.max(0,video.duration||1))}catch(e){resolve('')}};video.onseeked=()=>{try{let canvas=document.createElement('canvas');canvas.width=320;canvas.height=180;canvas.getContext('2d').drawImage(video,0,0,320,180);resolve(canvas.toDataURL('image/jpeg',0.75))}catch(e){resolve('')}};video.onerror=()=>resolve('');video.src=url;video.load();setTimeout(()=>resolve(''),7000)})}catch(e){return ''}}
async function loadVideos(own=false){let target=own?$('myVideos'):$('videos');if(!own){$('emptyHome').hidden=false;$('emptyHome').innerHTML='<div class="play-mark">▶</div>'; }target.innerHTML='';let {data,error}=await sb.from('videos').select('*').order('created_at',{ascending:false});if(error){if(!own){$('emptyHome').hidden=false;$('emptyHome').className='empty';$('emptyHome').textContent='Videos load nahi hue: '+error.message}return}let rows=own?(data||[]).filter(v=>v.user_id===currentUser?.id):(data||[]);if(!own){$('emptyHome').hidden=!!rows.length;if(!rows.length){$('emptyHome').className='empty';$('emptyHome').textContent='Abhi koi video nahi hai'}}for(let v of rows)await makeCard(v,target)}
async function loadSubscribedVideos(){$('subscribedVideos').innerHTML='';if(!currentUser){$('emptySubscribed').hidden=false;$('emptySubscribed').textContent='Subscribed videos ke liye login karein.';return}let {data:subs,error}=await sb.from('subscriptions').select('channel_id').eq('subscriber_id',currentUser.id);if(error){$('emptySubscribed').hidden=false;$('emptySubscribed').textContent=error.message;return}let ids=(subs||[]).map(x=>x.channel_id);if(!ids.length){$('emptySubscribed').hidden=false;return}let {data,error:ve}=await sb.from('videos').select('*').in('user_id',ids).order('created_at',{ascending:false});if(ve){$('emptySubscribed').hidden=false;$('emptySubscribed').textContent=ve.message;return}$('emptySubscribed').hidden=!!data?.length;for(let v of data||[])await makeCard(v,$('subscribedVideos'))}
async function signedUrl(path){let {data,error}=await sb.storage.from(VIDEO_BUCKET).createSignedUrl(path,3600);if(error)throw error;return data.signedUrl}
async function openWatch(v){currentVideo=v;currentVideoPath=v.file_path;currentVideoChannel=v.user_id;setPage('watch');$('watchContent').hidden=true;$('watchLoading').hidden=false;$('watchLoading').textContent='Video load ho raha hai...';try{$('watchPlayer').pause();$('watchPlayer').removeAttribute('src');$('watchPlayer').load();$('watchPlayer').src=await signedUrl(v.file_path);$('watchTitle').textContent=v.title||'Untitled';$('watchStats').textContent=Number(v.views||0).toLocaleString()+' views · '+timeAgo(v.created_at);let viewResult=await sb.rpc('increment_video_view',{p_video_id:v.id});if(!viewResult.error){currentVideo.views=Number(v.views||0)+1;$('watchStats').textContent=currentVideo.views.toLocaleString()+' views · '+timeAgo(v.created_at)}let isOwner=!!currentUser&&currentUser.id===v.user_id;$('ownerSettingsBtn').hidden=!isOwner;$('videoSettingsPanel').hidden=true;$('editVideoTitle').value=v.title||'';let p=await getProfile(v.user_id);$('watchChannel').textContent=p.channel_name||'Surf Channel';$('watchUsername').textContent=p.username?'@'+p.username:'';$('watchAvatar').src=await getImage(p.logo_path);$('subscribeBtn').hidden=!currentUser||currentUser.id===v.user_id;await refreshReactions();await refreshSubscribe();let {data:rel}=await sb.from('videos').select('*').neq('id',v.id).order('created_at',{ascending:false}).limit(8);$('relatedVideos').innerHTML='';for(let x of rel||[])await makeCard(x,$('relatedVideos'));$('watchLoading').hidden=true;$('watchContent').hidden=false}catch(e){$('watchLoading').textContent='Video nahi khul saka: '+e.message}}
async function refreshReactions(){let {data}=await sb.from('video_likes').select('is_like,user_id').eq('video_id',currentVideo.id);let rows=data||[];$('likeCount').textContent=rows.filter(x=>x.is_like).length;$('dislikeCount').textContent=rows.filter(x=>!x.is_like).length;let mine=rows.find(x=>x.user_id===currentUser?.id);currentReaction=mine?mine.is_like:null;$('likeBtn').classList.toggle('selected',currentReaction===true);$('dislikeBtn').classList.toggle('selected',currentReaction===false)}
async function setReaction(like){if(!currentUser){alert('Like karne ke liye pehle login karein.');return}let {data:old}=await sb.from('video_likes').select('id,is_like').eq('video_id',currentVideo.id).eq('user_id',currentUser.id).maybeSingle();let r;if(old&&old.is_like===like)r=await sb.from('video_likes').delete().eq('id',old.id);else r=await sb.from('video_likes').upsert({video_id:currentVideo.id,user_id:currentUser.id,is_like:like},{onConflict:'video_id,user_id'});if(r.error){alert(r.error.message);return}await refreshReactions()}
async function refreshSubscribe(){if(!currentUser||currentUser.id===currentVideoChannel)return;let {data}=await sb.from('subscriptions').select('id').eq('subscriber_id',currentUser.id).eq('channel_id',currentVideoChannel).maybeSingle();$('subscribeBtn').textContent=data?'Subscribed':'Subscribe';$('subscribeBtn').style.background=data?'#444':'#ff1744'}
async function toggleSubscribe(){if(!currentUser){alert('Subscribe karne ke liye pehle login karein.');return}let {data}=await sb.from('subscriptions').select('id').eq('subscriber_id',currentUser.id).eq('channel_id',currentVideoChannel).maybeSingle();let r=data?await sb.from('subscriptions').delete().eq('id',data.id):await sb.from('subscriptions').insert({subscriber_id:currentUser.id,channel_id:currentVideoChannel});if(r.error){alert(r.error.message);return}await refreshSubscribe()}

function toggleVideoSettings(){$('videoSettingsPanel').hidden=!$('videoSettingsPanel').hidden;$('videoSettingsMessage').textContent=''}
async function saveVideoTitle(){if(!currentUser||!currentVideo||currentUser.id!==currentVideo.user_id)return;let title=$('editVideoTitle').value.trim();if(!title){$('videoSettingsMessage').textContent='Title likho.';return}let {error}=await sb.from('videos').update({title}).eq('id',currentVideo.id).eq('user_id',currentUser.id);if(error){$('videoSettingsMessage').textContent='Title change nahi hua: '+error.message;return}currentVideo.title=title;$('watchTitle').textContent=title;$('videoSettingsMessage').textContent='Title update ho gaya.';await loadVideos();await loadVideos(true)}
async function deleteCurrentVideo(){if(!currentUser||!currentVideo||currentUser.id!==currentVideo.user_id)return;if(!confirm('Kya aap is video ko hamesha ke liye delete karna chahte hain?'))return;$('videoSettingsMessage').textContent='Deleting...';let paths=[currentVideo.file_path,currentVideo.thumbnail_path].filter(Boolean);let {error:dbError}=await sb.from('videos').delete().eq('id',currentVideo.id).eq('user_id',currentUser.id);if(dbError){$('videoSettingsMessage').textContent='Delete nahi hua: '+dbError.message;return}if(paths.length){let {error:storageError}=await sb.storage.from(VIDEO_BUCKET).remove(paths);if(storageError)console.warn('Storage cleanup:',storageError.message)}$('watchPlayer').pause();$('watchPlayer').removeAttribute('src');$('watchPlayer').load();currentVideo=null;currentVideoPath=null;await loadVideos();await loadVideos(true);setPage('profile')}
  async function reportCurrentVideo(){
  if(!currentUser){
    alert('Report karne ke liye login karein.');
    return;
  }

  if(!currentVideo)return;

  const reason=prompt('Report reason likhein:');
  if(!reason || !reason.trim())return;

  const {error}=await sb.from('video_reports').insert({
    video_id:currentVideo.id,
    reporter_id:currentUser.id,
    reason:reason.trim()
  });

  if(error){
    alert('Report nahi hua: '+error.message);
  }else{
    alert('Report submit ho gaya.');
  }
  }
async function loadAdminReports(){
  const box=$('adminReports');

  if(!currentUser){
    box.textContent='Admin login karein.';
    return;
  }

  const {data:admin,error:adminError}=await sb
    .from('admin_users')
    .select('user_id')
    .eq('user_id',currentUser.id)
    .maybeSingle();

  if(adminError||!admin){
    box.textContent='Aap admin nahi hain.';
    return;
  }

  const {data:reports,error}=await sb
    .from('video_reports')
    .select('id,video_id,reason,created_at,videos(id,title,file_path,thumbnail_path,user_id,created_at,views)')
    .order('created_at',{ascending:false});

  if(error){
    box.textContent='Error: '+error.message;
    return;
  }

  if(!reports.length){
    box.textContent='Abhi koi report nahi hai.';
    return;
  }

  box.innerHTML='';

  for(const r of reports){
    const div=document.createElement('div');
    div.style.padding='12px';
    div.style.borderBottom='1px solid #555';

    const heading=document.createElement('h3');
    heading.textContent=r.videos?.title||'Video nahi mila';

    const reason=document.createElement('p');
    reason.textContent='Reason: '+r.reason;

    div.append(heading,reason);

    if(r.videos){
      if(r.videos.thumbnail_path){
        const img=document.createElement('img');
        img.src=await signedUrl(r.videos.thumbnail_path);
        img.style.width='180px';
        img.style.maxWidth='100%';
        img.style.borderRadius='8px';
        div.appendChild(img);
      }

      const watch=document.createElement('button');
      watch.textContent='▶ Watch Video';
      watch.onclick=()=>openWatch(r.videos);
      div.appendChild(watch);
    }

    const btn=document.createElement('button');
    btn.textContent='Delete Report';
    btn.onclick=async()=>{
      if(!confirm('Delete this report?'))return;
      const {error}=await sb.from('video_reports').delete().eq('id',r.id);
      if(error)alert(error.message);
      else loadAdminReports();
    };

    div.appendChild(btn);
    box.appendChild(div);
  }
  }
  const box=$('adminReports');
  if(!currentUser){
    box.textContent='Admin login karein.';
    return;
  }

  const {data:admin,error:adminError}=await sb
    .from('admin_users')
    .select('user_id')
    .eq('user_id',currentUser.id)
    .maybeSingle();

  if(adminError||!admin){
    box.textContent='Aap admin nahi hain.';
    return;
  }

  const {data:reports,error}=await sb
    .from('video_reports')
    .select('id,video_id,reason,created_at,videos(title)')
    .order('created_at',{ascending:false});

  if(error){
    box.textContent='Error: '+error.message;
    return;
  }

  if(!reports.length){
    box.textContent='Abhi koi report nahi hai.';
    return;
  }

  box.innerHTML='';
  reports.forEach(r=>{
    const div=document.createElement('div');
    div.style.padding='12px';
    div.style.borderBottom='1px solid #555';
    const title=r.videos?.title||'Video nahi mila';
    div.innerHTML='';
    const heading=document.createElement('h3');
    heading.textContent=title;
    const reason=document.createElement('p');
    reason.textContent='Reason: '+r.reason;
    const btn=document.createElement('button');
    btn.textContent='Delete Report';
    btn.onclick=async()=>{
      const {error}=await sb.from('video_reports').delete().eq('id',r.id);
      if(error)alert(error.message);
      else loadAdminReports();
    };
    div.append(heading,reason,btn);
    box.appendChild(div);
  });
  }
async function downloadCurrentVideo(){if(!currentVideoPath)return;try{let {data,error}=await sb.storage.from(VIDEO_BUCKET).createSignedUrl(currentVideoPath,3600,{download:true});if(error)throw error;let a=document.createElement('a');a.href=data.signedUrl;a.download='surf-video';document.body.appendChild(a);a.click();a.remove()}catch(e){alert('Download nahi ho saka: '+e.message)}}
async function uploadVideo(){if(!currentUser){$('uploadMessage').textContent='Pehle Profile mein login karein.';return}let f=$('videoFile').files[0],title=$('videoTitle').value.trim(),image=$('thumbnailFile').files[0];if(!f||!title){$('uploadMessage').textContent='Title aur video file chahiye.';return}let stamp=Date.now(),path=currentUser.id+'/'+stamp+'_'+f.name.replace(/[^a-z0-9._-]/gi,'_');$('uploadMessage').textContent='Video uploading...';let up=await sb.storage.from(VIDEO_BUCKET).upload(path,f,{upsert:false,contentType:f.type});if(up.error){$('uploadMessage').textContent=up.error.message;return}let thumbPath=null;if(image){let ip=currentUser.id+'/'+stamp+'_thumb_'+image.name.replace(/[^a-z0-9._-]/gi,'_');let iu=await sb.storage.from(VIDEO_BUCKET).upload(ip,image,{upsert:false,contentType:image.type});if(iu.error){$('uploadMessage').textContent='Video upload hua, thumbnail upload nahi hua: '+iu.error.message;return}thumbPath=ip}let ins=await sb.from('videos').insert({title,file_path:path,user_id:currentUser.id,thumbnail_path:thumbPath});if(ins.error){$('uploadMessage').textContent='File upload ho gaya, lekin database save nahi hua: '+ins.error.message;return}$('uploadMessage').textContent='Upload complete';$('videoTitle').value='';$('thumbnailFile').value='';$('videoFile').value='';await loadVideos();await loadVideos(true);setPage('home')}
sb.auth.onAuthStateChange(()=>setTimeout(refreshProfile,0));refreshProfile();let savedPage='home';try{savedPage=sessionStorage.getItem('surf_last_page')||'home'}catch(e){}if(savedPage==='watch')savedPage='home';if(!$(savedPage))savedPage='home';document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(savedPage).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===savedPage));if(savedPage==='profile')refreshProfile();else if(savedPage==='subscribed')loadSubscribedVideos();else if(savedPage==='home')loadVideos();
